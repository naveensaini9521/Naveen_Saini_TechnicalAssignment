{% extends "base.html" %}
{% block title %}New Order{% endblock %}
{% block content %}

<div class="page-header">
  <h1>New Sales Order</h1>
  <a href="{{ url_for('orders.list_orders') }}" class="btn secondary">← Back</a>
</div>

<form method="post" id="order-form">

  <div class="form-card">
    <div class="form-row">
      <label>Customer *
        <select name="customer_id" required>
          <option value="">— select —</option>
          {% for c in customers %}
            <option value="{{ c.id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </label>

      <label>Order date
        <input type="date" name="order_date" value="{{ request.form.get('order_date','') }}">
      </label>
    </div>
  </div>

  <h2>Items</h2>

  <div class="table-card">
    <table id="items-table">
      <thead>
        <tr>
          <th>Product</th>
          <th class="num" style="width:100px;">Qty</th>
          <th class="num" style="width:120px;">Rate</th>
          <th class="num" style="width:120px;">Amount</th>
          <th style="width:50px;"></th>
        </tr>
      </thead>
      <tbody id="items-body">
        <tr>
          <td>
            <select name="product_id[]" class="product-select" required>
              <option value="">— select —</option>
              {% for p in products %}
                <option value="{{ p.id }}" data-price="{{ p.price }}" data-stock="{{ p.stock_quantity }}">
                  {{ p.product_code }} — {{ p.name }} (stock {{ p.stock_quantity }})
                </option>
              {% endfor %}
            </select>
          </td>
          <td><input type="number" name="quantity[]" class="qty num" min="1" value="1" required></td>
          <td class="rate num">—</td>
          <td class="amount num">—</td>
          <td><button type="button" class="remove-row link-danger" aria-label="Remove row">×</button></td>
        </tr>
      </tbody>
    </table>

    <div class="table-actions">
      <button type="button" id="add-row" class="secondary">+ Add product</button>
    </div>
  </div>

  <div class="form-card totals-card">
    <label>Discount % (0–20)
      <input type="number" name="discount_percentage" id="discount"
             min="0" max="20" step="0.01"
             value="{{ request.form.get('discount_percentage','0') }}">
    </label>

    <table class="totals">
      <tr><th>Subtotal</th><td id="subtotal">0.00</td></tr>
      <tr><th>Discount amount</th><td id="discount-amt">0.00</td></tr>
      <tr><th>Grand total</th><td id="grand-total"><strong>0.00</strong></td></tr>
    </table>
  </div>

  <div class="action-bar">
    <button type="submit" id="save-btn">Save Draft</button>
    <a href="{{ url_for('orders.list_orders') }}" class="btn secondary">Cancel</a>
  </div>

</form>

<script src="{{ url_for('static', filename='js/orders.js') }}"></script>
{% endblock %}
