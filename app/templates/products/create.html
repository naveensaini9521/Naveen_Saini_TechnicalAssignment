{% extends "base.html" %}
{% block title %}New Product{% endblock %}
{% block content %}
<h1>New Product</h1>

<form method="post">
  <label>Product code * <input name="product_code" required></label>
  <label>Name * <input name="name" required></label>
  <label>Category * <input name="category" required></label>
  <label>Price * <input name="price" type="number" step="0.01" min="0" required></label>
  <label>Opening stock * <input name="stock_quantity" type="number" min="0" value="0" required></label>
  <label>Status
    <select name="status">
      <option value="Active" selected>Active</option>
      <option value="Inactive">Inactive</option>
    </select>
  </label>
  <button type="submit">Create</button>
  <a href="{{ url_for('products.list_products_view') }}">Cancel</a>
</form>
{% endblock %}
