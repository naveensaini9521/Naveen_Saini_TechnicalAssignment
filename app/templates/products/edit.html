{% extends "base.html" %}
{% block title %}Edit Product{% endblock %}
{% block content %}

<div class="page-header">
  <h1>Edit Product <code class="code-pill">{{ product.product_code }}</code></h1>
  <a href="{{ url_for('products.list_products_view') }}" class="btn secondary">← Back</a>
</div>

<form method="post" class="form-card">
  <div class="form-row">
    <label>Product code *
      <input name="product_code" value="{{ product.product_code }}" required>
    </label>
    <label>Name *
      <input name="name" value="{{ product.name }}" required>
    </label>
  </div>

  <div class="form-row">
    <label>Category *
      <input name="category" value="{{ product.category }}" required>
    </label>
    <label>Status
      <select name="status">
        <option value="Active"   {% if product.is_active %}selected{% endif %}>Active</option>
        <option value="Inactive" {% if not product.is_active %}selected{% endif %}>Inactive</option>
      </select>
    </label>
  </div>

  <div class="form-row">
    <label>Price *
      <input name="price" type="number" step="0.01" min="0" value="{{ product.price }}" required>
    </label>
    <label>Current stock
      <input type="text" value="{{ product.stock_quantity }}" disabled>
    </label>
  </div>

  <p class="hint">
    Stock is <strong>read-only</strong> here — change it via
    <a href="{{ url_for('inventory.adjust') }}">Inventory → Adjust stock</a>.
  </p>

  <div class="action-bar">
    <button type="submit">Save changes</button>
    <a href="{{ url_for('products.list_products_view') }}" class="btn secondary">Cancel</a>
  </div>
</form>

{% endblock %}
