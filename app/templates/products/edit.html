{% extends "base.html" %}
{% block title %}Edit Product{% endblock %}
{% block content %}
<h1>Edit Product</h1>

<form method="post">
  <label>Product code * <input name="product_code" value="{{ product.product_code }}" required></label>
  <label>Name * <input name="name" value="{{ product.name }}" required></label>
  <label>Category * <input name="category" value="{{ product.category }}" required></label>
  <label>Price * <input name="price" type="number" step="0.01" min="0" value="{{ product.price }}" required></label>
  <p><strong>Current stock:</strong> {{ product.stock_quantity }}
     &mdash; stock is changed via <a href="{{ url_for('inventory.adjust') }}">Inventory → Adjust</a>.</p>
  <label>Status
    <select name="status">
      <option value="Active"   {% if product.is_active %}selected{% endif %}>Active</option>
      <option value="Inactive" {% if not product.is_active %}selected{% endif %}>Inactive</option>
    </select>
  </label>
  <button type="submit">Save</button>
  <a href="{{ url_for('products.list_products_view') }}">Cancel</a>
</form>
{% endblock %}
