{% extends "base.html" %}
{% block title %}Low Stock{% endblock %}
{% block content %}

<div class="page-header">
  <h1>Low Stock Report</h1>
  <a href="{{ url_for('reports.home') }}" class="btn secondary">← Back to reports</a>
</div>

<form method="get" class="filters">
  <label>Threshold <input type="number" name="threshold" min="0" value="{{ threshold }}" required></label>
  <button type="submit">Show</button>
</form>

<table>
  <thead>
    <tr>
      <th>Code</th>
      <th>Product</th>
      <th class="num">Stock</th>
    </tr>
  </thead>
  <tbody>
    {% for r in rows %}
    <tr>
      <td><code class="code-pill">{{ r.product_code }}</code></td>
      <td>{{ r.product_name }}</td>
      <td class="num">
        <span class="pill {% if r.stock_quantity == 0 %}pill-rose{% elif r.stock_quantity < 10 %}pill-amber{% else %}pill-green{% endif %}">
          {{ r.stock_quantity }}
        </span>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="3" class="empty-row">No products below threshold.</td></tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
